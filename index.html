<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}

.chart{display:flex;align-items:stretch;gap:6px;height:190px;margin-top:10px}

.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--tx2);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.hb .tr{background:var(--vm);height:12px;border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px}
.sc{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}

.tbl th{background:var(--vm);color:var(--vo);font-weight:600}
.tbl tr.tot td{font-weight:600;background:var(--bg)}
.card h3{margin:0 0 2px;font-size:16px;font-weight:600}

@keyframes cf-abre{0%,8%{transform:scaleX(1)}20%,68%{transform:scaleX(.16)}80%,100%{transform:scaleX(1)}}
@keyframes cf-gira{0%{transform:rotate(0)}14%,100%{transform:rotate(300deg)}}
@keyframes cf-sube{0%,22%{opacity:0;transform:translate(120px,106px) rotate(0deg) scale(.5)}32%{opacity:1}62%{opacity:1}74%,100%{opacity:0;transform:translate(calc(120px + var(--dx)),14px) rotate(var(--r)) scale(1)}}
.cf-puerta{transform-origin:72px 112px}
.cf-dial{transform-origin:120px 112px}
.cf-b{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .cf-puerta{animation:cf-abre 6s ease-in-out infinite}
  .cf-dial{animation:cf-gira 6s ease-in-out infinite}
  .cf-b{animation:cf-sube 6s ease-out var(--d) infinite backwards}
}
@media (prefers-reduced-motion:reduce){.cf-puerta{transform:scaleX(.16)}.cf-b{display:none}}
@media (min-width:900px){
  body.nav #app{max-width:none;margin:0 0 0 232px;padding-bottom:40px}
  .bar{right:auto;top:0;width:232px;display:block;border-top:0;border-right:1px solid var(--bd);padding:18px 12px;overflow-y:auto}
  .bar-in{max-width:none;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-size:21px;font-weight:600;letter-spacing:-.3px;color:var(--vo)}
  .bar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;width:100%;font-size:15px;padding:12px 14px;border-radius:12px}
  .bar button.on{background:var(--vm)}
  .top{padding:20px 36px}
  .sub{padding:14px 28px}
  .pad{max-width:760px;margin:0 auto;padding:28px 32px}
  .pad.wide{max-width:1240px}
  .toast{bottom:28px}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 12px}
  .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .login{max-width:460px;margin:0 auto;min-height:0;padding-top:72px}
  .anim{margin-top:40px}
}
</style>

<script type="module">

const firebaseConfig = {

const app = initializeApp(firebaseConfig);

const S = { user:null, rol:null, cid:null, nombre:'', caja:0, prestamos:[], cobradores:[], view:'login', params:{}, loginError:'', loginUser:'', stale:false };

const CK = 'cartera_v1_';
const guardar = () => {
  try {
    if (!S.user) return;
    const d = S.rol === 'admin'
      ? { rol: 'admin', cobradores: S.cobradores.map(c => ({ id: c.id, nombre: c.nombre, usuario: c.usuario, uid: c.uid, activo: c.activo, caja: c.caja, activos: c.activos, mora: c.mora, calle: c.calle })) }
      : { rol: 'cobrador', cid: S.cid, nombre: S.nombre, caja: S.caja, prestamos: S.prestamos.map(p => ({ ...p, vence: p.vence.toISOString(), inicio: p.inicio.toISOString(), pagadoEn: p.pagadoEn ? p.pagadoEn.toISOString() : null, proxima: p.proxima ? p.proxima.toISOString() : null })) };
    localStorage.setItem(CK + S.user.uid, JSON.stringify(d));
  } catch (_) {}
};
const leer = uid => {
  try {
    const d = JSON.parse(localStorage.getItem(CK + uid));
    if (!d) return null;
    if (d.prestamos) d.prestamos = d.prestamos.map(p => ({ ...p, vence: new Date(p.vence), inicio: new Date(p.inicio), pagadoEn: p.pagadoEn ? new Date(p.pagadoEn) : null, proxima: p.proxima ? new Date(p.proxima) : null }));
    return d;
  } catch (_) { return null; }
};
const limpiarCache = () => {
  try { Object.keys(localStorage).filter(k => k.startsWith(CK)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
};

const I = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  plus:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>',

  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a3 3 0 00-5 2c0 3 5 1.5 5 4.500a3 3 0 01-5 2M12 6v1.500M12 16.500V18"/>',
  refresh:'<path d="M20 11a8 8 0 00-14-4L4 9"/><path d="M4 4v5h5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/><path d="M12 15v2"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.2A9.6 9.6 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.8M6.5 7.6A16.6 16.6 0 002 12s4 7 10 7c1.5 0 2.9-.4 4.1-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>',
  chart:'<path d="M5 20v-7M12 20V5M19 20v-10"/><path d="M3 20h18"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

const icc = n => ic(n, 20).replace('<svg ', '<svg class="ico" ');
const LOGO = (s = 40) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="Cartera"><rect x="1" y="1" width="62" height="62" rx="18" fill="#1E7B4A" stroke="rgba(255,255,255,.35)" stroke-width="2"/><text x="32" y="47" text-anchor="middle" font-size="44" font-weight="700" fill="#fff" font-family="system-ui,-apple-system,Roboto,sans-serif">$</text></svg>`;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const miles = n => String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const money = n => (Math.round(n || 0) < 0 ? '-$' : '$') + miles(n);
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(0,0,0,0); return x; };
const fmtF = d => d.toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' }).replace(/\./g, '');
const fmtFH = t => t && t.toDate ? t.toDate().toLocaleString('es-CO') : '';
const num = v => parseInt(String(v).replace(/\D/g, ''), 10) || 0;
const tasaNum = v => parseFloat(String(v).replace(',', '.')) || 0;
const interes = (cap, tasa) => Math.round(cap * tasa / 100);
const diasA = d => Math.round((d - hoy0()) / 86400000);
const ini2 = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const emailDe = u => { u = u.trim().toLowerCase(); return u.includes('@') ? u : u.replace(/[^a-z0-9._-]/g, '') + DOMINIO; };
const wa = (cel, txt) => 'https://wa.me/57' + cel + '?text=' + encodeURIComponent(txt);
const col = (cid, n) => collection(db, 'carteras', cid, n);

function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast' + (tipo === 'err' ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function msgErr(e) {
  const c = (e && e.code) || '';
  if (c.includes('permission-denied')) return 'No tienes permiso para esta acción.';
  if (c.includes('unavailable') || c.includes('network')) return 'Sin conexión. Revisa tu internet e intenta de nuevo.';
  if (c.includes('email-already-in-use')) return 'Ese usuario ya existe.';
  if (c.includes('weak-password')) return 'La clave debe tener al menos 6 caracteres.';
  if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'Clave actual incorrecta.';
  return 'Algo salió mal: ' + ((e && e.message) || 'error desconocido');
}
async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { console.error(e); toast(msgErr(e), 'err'); }
  finally { if (btn) btn.disabled = false; }
}

async function cargarCaja(cid) {
  try {
    const r = await getAggregateFromServer(col(cid, 'movimientos'), { total: sum('efecto') });
    return r.data().total || 0;
  } catch (e) {
    const s = await getDocs(col(cid, 'movimientos'));
    let t = 0; s.forEach(d => t += d.data().efecto || 0);
    return t;
  }
}
const norm = (id, d) => ({ ...d, id, vence: d.vence.toDate(), inicio: d.inicio.toDate(), pagadoEn: d.pagadoEn ? d.pagadoEn.toDate() : null, proxima: d.proxima ? d.proxima.toDate() : null });
async function cargarActivos(cid) {
  const s = await getDocs(query(col(cid, 'prestamos'), where('estado', '==', 'activo')));
  return s.docs.map(d => norm(d.id, d.data())).sort((a, b) => vEf(a) - vEf(b));
}
async function cargarCobrador() {
  const [caja, pr] = await Promise.all([cargarCaja(S.cid), cargarActivos(S.cid)]);
  S.caja = caja; S.prestamos = pr;
  guardar();
}
async function cargarAdmin() {
  const cs = await getDocs(collection(db, 'carteras'));
  const hoy = hoy0();
  S.cobradores = await Promise.all(cs.docs.map(async d => {
    const c = { id: d.id, ...d.data() };
    const [caja, act] = await Promise.all([cargarCaja(d.id), cargarActivos(d.id)]);
    c.caja = caja; c.activos = act.length; c.mora = act.filter(p => vEf(p) < hoy).length; c.calle = act.reduce((a, p) => a + capPend(p), 0);
    return c;

  S.cobradores.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

}

function estadoP(p) {
  const d = diasA(vEf(p)), c = esCuotas(p);
  if (d < 0) return { mora: true, txt: 'Mora ' + (-d) + (d === -1 ? ' día' : ' días') };
  if (d === 0) return { mora: false, txt: c ? 'Cuota hoy' : 'Vence hoy' };
  if (d === 1) return { mora: false, txt: c ? 'Cuota mañana' : 'Vence mañana' };
  return { mora: false, txt: (c ? 'Cuota en ' : 'Vence en ') + d + ' días' };
}
const totalP = p => p.capital + p.interes;
const esCuotas = p => p.modalidad === 'cuotas';
const vEf = p => (esCuotas(p) && p.proxima) ? p.proxima : p.vence;
const saldoP = p => totalP(p) - (p.abonado || 0);
const capPend = p => esCuotas(p) ? p.capital - ((p.abonado || 0) - (p.interesCobrado || 0)) : p.capital;
const TIPOS_PAGO = ['pago_total', 'renovacion', 'cuota'];
const esPago = t => TIPOS_PAGO.includes(t);
const cuotaK = p => (p.cuotasPagadas || 0) + 1;
const cuotaMonto = p => cuotaK(p) >= p.nCuotas ? saldoP(p) : p.cuotaValor;
const intPend = p => p.interes - (p.interesCobrado || 0);
const intCuota = (p, m, ult) => ult ? intPend(p) : Math.min(Math.round(p.interes * m / totalP(p)), intPend(p));
const diasTxt = n => n + (n === 1 ? ' día' : ' días');
const planTxt = p => esCuotas(p)
  ? `en ${p.nCuotas} cuotas de ${money(p.cuotaValor)} cada ${diasTxt(p.cadaDias)} (primera el ${fmtF(p.proxima)}, última el ${fmtF(p.vence)})`

function render() {

function go(view, params) {

}

async function abrirHist(tab) {
  S.params = { ...S.params, tab };
  S.view = 'c_hist'; render();
  if (tab === 'pagados' && S.params.pagados === undefined) {
    const s = await getDocs(query(col(S.cid, 'prestamos'), where('estado', '==', 'pagado')));
    S.params.pagados = s.docs.map(d => norm(d.id, d.data())).sort((a, b) => (b.pagadoEn || 0) - (a.pagadoEn || 0));
  }
  if (tab === 'anio') await cargarAnio(S.params.anio || new Date().getFullYear());
  if (S.view === 'c_hist') render();
}
async function cargarAnio(y) {
  S.params.anio = y; S.params.res = null; render();
  const s = await getDocs(query(col(S.cid, 'movimientos'), where('fecha', '>=', Timestamp.fromDate(new Date(y, 0, 1))), where('fecha', '<', Timestamp.fromDate(new Date(y + 1, 0, 1)))));
  const r = { prestado: 0, cobrado: 0, intereses: 0, gastos: 0, meses: Array.from({ length: 12 }, () => ({ prestado: 0, intereses: 0, gastos: 0 })) };
  s.forEach(d => {
    const m = d.data(), mes = m.fecha.toDate().getMonth();
    if (m.tipo === 'prestamo') { r.prestado += m.monto; r.meses[mes].prestado += m.monto; }
    else if (m.tipo === 'gasto') { r.gastos += m.monto; r.meses[mes].gastos += m.monto; }
    else if (esPago(m.tipo)) { r.cobrado += m.monto; r.intereses += m.interes || 0; r.meses[mes].intereses += m.interes || 0; }
  });
  S.params.res = r;
}
async function sumaTipo(cid, tipo) {
  const q = query(col(cid, 'movimientos'), where('tipo', '==', tipo));
  try {
    const r = await getAggregateFromServer(q, { t: sum('monto') });
    return r.data().t || 0;
  } catch (e) {
    const s = await getDocs(q);
    let t = 0; s.forEach(d => t += d.data().monto || 0);
    return t;
  }
}
async function interesesCobrados(cid) {
  const q = query(col(cid, 'movimientos'), where('tipo', 'in', TIPOS_PAGO));
  try {
    const r = await getAggregateFromServer(q, { t: sum('interes') });
    return r.data().t || 0;
  } catch (e) {
    const s = await getDocs(q);
    let t = 0; s.forEach(d => t += d.data().interes || 0);
    return t;
  }
}
async function abrirGastos() {
  S.params = {}; S.view = 'c_gastos'; render();
  const [s, ti] = await Promise.all([getDocs(query(col(S.cid, 'movimientos'), where('tipo', '==', 'gasto'))), interesesCobrados(S.cid).catch(() => 0)]);
  const todos = s.docs.map(d => d.data());
  S.params.totalGastos = todos.reduce((a, m) => a + (m.monto || 0), 0);
  S.params.intereses = ti;
  S.params.gastos = todos.sort((a, b) => b.fecha.toMillis() - a.fecha.toMillis()).slice(0, 30);
  if (S.view === 'c_gastos') render();
}
async function abrirDet(id) {
  S.params = { id, movs: null }; S.view = 'c_det'; render(); window.scrollTo(0, 0);
  const s = await getDocs(query(col(S.cid, 'movimientos'), where('prestamoId', '==', id)));
  S.params.movs = s.docs.map(d => d.data()).sort((a, b) => b.fecha.toMillis() - a.fecha.toMillis());
  if (S.view === 'c_det' && S.params.id === id) render();
}
async function abrirCob(id) {
  S.params = { id }; S.view = 'a_cob'; render(); window.scrollTo(0, 0);
  const [pr, ms] = await Promise.all([cargarActivos(id), getDocs(query(col(id, 'movimientos'), orderBy('fecha', 'desc')))]);
  const todos = ms.docs.map(d => d.data());
  const sm = f => todos.filter(f).reduce((a, m) => a + (m.monto || 0), 0);
  S.params.pr = pr; S.params.mv = todos.slice(0, 30);
  S.params.tot = { recargas: sm(m => m.tipo === 'asignacion'), retiros: sm(m => m.tipo === 'retiro'), gastos: sm(m => m.tipo === 'gasto'), intereses: todos.filter(m => esPago(m.tipo)).reduce((a, m) => a + (m.interes || 0), 0) };
  if (S.view === 'a_cob' && S.params.id === id) render();
}

function pagoUI() {
  const p = S.prestamos.find(x => x.id === S.params.id); if (!p) return;
  const t = S.params.tipo;
  $('#o_total').classList.toggle('sel', t === 'total');
  const oR = $('#o_ren'), oC = $('#o_cuota');
  if (oR) oR.classList.toggle('sel', t === 'ren');
  if (oC) oC.classList.toggle('sel', t === 'cuota');
  $('#f_tasa').classList.toggle('oculto', t !== 'ren');
  const r = $('#resumen');
  if (t === 'cuota') {
    const k = cuotaK(p), ult = k >= p.nCuotas, m = cuotaMonto(p), it = intCuota(p, m, ult);
    r.innerHTML = `<b>Cuota ${k} de ${p.nCuotas}: ${money(m)}</b><br>Capital ${money(m - it)} + interés ${money(it)}. ` + (ult ? 'Es la última cuota: el préstamo se cerrará y pasará al historial de pagados.' : `Quedará un saldo de ${money(saldoP(p) - m)} y la próxima cuota vence el ${fmtF(addDias(p.proxima, p.cadaDias))}.`);
  } else if (t === 'total') {
    const s = saldoP(p), ip = intPend(p);
    r.innerHTML = `<b>Pago total: ${money(s)}</b><br>Capital ${money(s - ip)} + interés ${money(ip)}. El préstamo se cerrará y pasará al historial de pagados.`;
  } else if (t === 'ren') {
    const nt = tasaNum($('#ntasa').value);
    const base = p.vence >= hoy0() ? p.vence : hoy0();
    r.innerHTML = `<b>Renovación: ${money(p.interes)}</b><br>Paga solo el interés. El capital de ${money(p.capital)} sigue vivo, con interés de ${money(interes(p.capital, nt))} (${nt}%) y nuevo vencimiento el ${fmtF(addDias(base, p.plazo))}.`;
  }
}

async function reunirDatos() {

const DIAS_SEM = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DIAS_C = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MES_C = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const MES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const pad2 = n => String(n).padStart(2, '0');
const isoF = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const deIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const corto = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' mil' : String(n); };
const sm = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const nombreRep = (r, ext) => `reporte-cartera-${isoF(r.d)}_a_${isoF(addDias(r.h, -1))}.${ext}`;

function rangoPreset(k, D) {
  const h = hoy0(), y = h.getFullYear();
  if (k === 'mes') return { desde: isoF(new Date(y, h.getMonth(), 1)), hasta: isoF(h) };
  if (k === '30') return { desde: isoF(addDias(h, -29)), hasta: isoF(h) };
  if (k === 'anio') return { desde: isoF(new Date(y, 0, 1)), hasta: isoF(h) };
  let min = null;
  if (D) D.movs.forEach(m => { if (m.fecha && (!min || m.fecha < min)) min = m.fecha; });
  return { desde: isoF(min || new Date(y, 0, 1)), hasta: isoF(h) };
}
function rangoActual() {
  let d = deIso(S.rango.desde), h = deIso(S.rango.hasta);
  if (h < d) { const t = d; d = h; h = t; }
  return { d, h: addDias(h, 1), txt: fmtF(d) + ' al ' + fmtF(h) };
}
function calcStats(D, r) {
  const movs = D.movs.filter(m => m.fecha && m.fecha >= r.d && m.fecha < r.h);
  const R = { movs, prestado: 0, cobrado: 0, intereses: 0, gastos: 0, recargas: 0, retiros: 0, nPrest: 0, nPagos: 0, meses: {}, dias: Array.from({ length: 7 }, () => ({ n: 0, v: 0 })), conceptos: {}, cobs: {} };
  movs.forEach(m => {
    const k = m.fecha.getFullYear() * 100 + m.fecha.getMonth();
    const mes = R.meses[k] || (R.meses[k] = { k, prestado: 0, cobrado: 0, intereses: 0, gastos: 0 });
    const cb = R.cobs[m.cobrador] || (R.cobs[m.cobrador] = { nombre: m.cobrador, prestado: 0, cobrado: 0, intereses: 0, gastos: 0 });
    if (m.tipo === 'prestamo') { R.prestado += m.monto; R.nPrest++; mes.prestado += m.monto; cb.prestado += m.monto; }
    else if (m.tipo === 'gasto') {
      R.gastos += m.monto; mes.gastos += m.monto; cb.gastos += m.monto;
      const c = (m.nota || '').split(':')[0].trim() || 'Sin concepto';
      R.conceptos[c] = (R.conceptos[c] || 0) + m.monto;
    } else if (esPago(m.tipo)) {
      R.cobrado += m.monto; R.intereses += m.interes; R.nPagos++;
      mes.cobrado += m.monto; mes.intereses += m.interes; cb.cobrado += m.monto; cb.intereses += m.interes;
      const d = R.dias[(m.fecha.getDay() + 6) % 7]; d.n++; d.v += m.monto;
    } else if (m.tipo === 'asignacion') R.recargas += m.monto;
    else if (m.tipo === 'retiro') R.retiros += m.monto;
  });
  R.utilidad = R.intereses - R.gastos;
  R.listaMeses = Object.values(R.meses).sort((a, b) => a.k - b.k);
  R.listaCobs = Object.values(R.cobs).filter(c => c.prestado || c.cobrado || c.gastos).sort((a, b) => a.nombre.localeCompare(b.nombre));
  R.listaConceptos = Object.entries(R.conceptos).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v);
  return R;
}

function chartCols(items, series, conValor) {
  const max = Math.max(1, ...items.flatMap(it => it.v));
  const cols = items.map(it => `<div class="col" title="${esc(it.t || '')}">${conValor ? `<span class="val">${it.v[0] ? corto(it.v[0]) : ''}</span>` : ''}<div class="bars">${it.v.map((x, i) => `<i class="b" style="height:${x > 0 ? Math.max(3, x / max * 100) : 0}%;background:${it.c || series[i].c}"></i>`).join('')}</div><small>${esc(it.l)}</small></div>`).join('');
  const ley = series.length > 1 ? `<div class="leyenda">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : '';
  return `<div class="chart">${cols}</div>${ley}`;
}
function barrasH(items, color) {
  const max = Math.max(1, ...items.map(i => i.v));
  return items.map(it => `<div class="hb"><span>${esc(it.l)}</span><div class="tr"><i style="width:${Math.max(3, it.v / max * 100)}%;background:${color}"></i></div><b>${money(it.v)}</b></div>`).join('');
}

  tabla('Por mes', ['Mes', 'Prestado', 'Cobrado', 'Intereses', 'Gastos', 'Utilidad'],

    { columnStyles: der([1, 2, 3, 4, 5]), foot: [['Total', money(R.prestado), money(R.cobrado), money(R.intereses), money(-R.gastos), money(R.utilidad)]] });
  tabla('Cobros por día de la semana', ['Día', 'Pagos recibidos', 'Valor cobrado'],

  tabla('Gastos por concepto', ['Concepto', 'Valor'], R.listaConceptos.map(c => [c.l, money(-c.v)]),
    { columnStyles: der([1]), foot: [['Total', money(-R.gastos)]] });
  tabla('Préstamos entregados', ['Fecha', 'Cobrador', 'Deudor', 'Monto', 'Tasa', 'Forma de pago'],
    R.movs.filter(m => m.tipo === 'prestamo').sort((a, b) => b.fecha - a.fecha).map(m => { const p = pm.get(m.prestamoId) || {}; return [fh(m.fecha), m.cobrador, m.deudor, money(m.monto), (p.tasa || 0) + '%', p.modalidad === 'cuotas' ? p.nCuotas + ' cuotas' : 'Un solo pago']; }),
    { columnStyles: der([3, 4]) });
  tabla('Pagos recibidos', ['Fecha', 'Cobrador', 'Deudor', 'Tipo', 'Total', 'Interés'],
    R.movs.filter(m => esPago(m.tipo)).sort((a, b) => b.fecha - a.fecha).map(m => [fh(m.fecha), m.cobrador, m.deudor, NOM_T(m.tipo) + (m.tipo === 'cuota' && m.cuotaNo ? ' ' + m.cuotaNo : ''), money(m.monto), money(m.interes)]),
    { columnStyles: der([4, 5]) });

// ============ Alerta de recarga para el cobrador ============
const KV = 'cartera_visto_';
let revTs = 0;
async function revisarRecargas(forzar) {
  if (S.rol !== 'cobrador' || !S.cid || $('#recarga')) return;
  if (!forzar && Date.now() - revTs < 20000) return;
  revTs = Date.now();
  const k = KV + S.cid;
  let visto = 0;
  try { visto = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch (_) {}
  const s = await getDocs(query(col(S.cid, 'movimientos'), where('tipo', '==', 'asignacion')));
  const todas = s.docs.map(d => d.data()).filter(m => m.fecha && m.fecha.toMillis);
  const ultima = todas.reduce((a, m) => Math.max(a, m.fecha.toMillis()), 0);
  if (!visto) { try { localStorage.setItem(k, String(ultima || Date.now())); } catch (_) {} return; }
  const nuevas = todas.filter(m => m.fecha.toMillis() > visto);
  if (!nuevas.length) return;
  await cargarCobrador();
  const total = nuevas.reduce((a, m) => a + (m.monto || 0), 0);
  const o = document.createElement('div');
  o.id = 'recarga'; o.className = 'ov';
  o.setAttribute('role', 'alertdialog'); o.setAttribute('aria-modal', 'true');
  o.innerHTML = `<div class="modal"><div class="av" style="margin:0 auto">${ic('wallet', 24)}</div><h3>Te recargaron la caja</h3><div class="big">+${money(total)}</div><p>${nuevas.length > 1 ? nuevas.length + ' recargas nuevas' : 'Recarga nueva'}. Tu caja ahora tiene <b>${money(S.caja)}</b>.</p><button class="btn" data-act="visto" data-ts="${ultima}">Entendido</button></div>`;
  document.body.appendChild(o);
}
setInterval(() => { if (!document.hidden && S.user && S.rol === 'cobrador' && !S.stale && !$('#aviso')) revisarRecargas().catch(() => {}); }, 60000);

  const t = e.target.closest('[data-act]');

document.addEventListener('change', e => {

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = F[f.dataset.form];
  if (S.stale && f.dataset.form !== 'login') return toast('Espera un momento, estoy actualizando los datos', 'err');
  if (fn) { const r = fn(f, e); if (r && r.catch) r.catch(err => { console.error(err); toast(msgErr(err), 'err'); }); }
});
function fmtInput(el) {
  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  const antes = el.value.slice(0, pos).replace(/\D/g, '').length;
  const out = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (out === el.value) return;
  el.value = out;
  let n = 0, i = 0;
  for (; i < out.length && n < antes; i++) if (/\d/.test(out[i])) n++;
  try { el.setSelectionRange(i, i); } catch (_) {}
}
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.fmt !== undefined) fmtInput(e.target);
  const f = e.target.closest('form');
  if (f && f.dataset.live && L[f.dataset.live]) L[f.dataset.live](f);
});

function iconoPNG(s, sinBordes) {
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#1E7B4A';
  if (sinBordes) x.fillRect(0, 0, s, s);
  else {
    const r = s * 0.28;
    x.beginPath(); x.moveTo(r, 0); x.arcTo(s, 0, s, s, r); x.arcTo(s, s, 0, s, r); x.arcTo(0, s, 0, 0, r); x.arcTo(0, 0, s, 0, r); x.closePath(); x.fill();
  }
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '700 ' + Math.round(s * (sinBordes ? 0.5 : 0.68)) + 'px system-ui,-apple-system,Roboto,sans-serif';
  x.fillText('$', s / 2, s * (sinBordes ? 0.67 : 0.72));
  return c.toDataURL('image/png');
}

  const i192 = iconoPNG(192), i512 = iconoPNG(512), iM = iconoPNG(512, true);
  document.getElementById('fav').href = i192;
  const t = document.createElement('link'); t.rel = 'apple-touch-icon'; t.href = i192; document.head.appendChild(t);

    icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: iM, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })); document.head.appendChild(m);
} catch (_) {}

const INACT_MIN = 5, AVISO_SEG = 30, KACT = 'cartera_ultact';
let ultimaAct = Date.now(), ultGuardado = 0;
const guardarAct = forzar => {
  const n = Date.now();
  if (!forzar && n - ultGuardado < 5000) return;
  ultGuardado = n;
  try { localStorage.setItem(KACT, String(n)); } catch (_) {}
};
const marcarAct = () => { ultimaAct = Date.now(); guardarAct(); };
function quitarAviso() { const o = $('#aviso'); if (o) o.remove(); }
function mostrarAviso(seg) {
  let o = $('#aviso');
  if (!o) {
    o = document.createElement('div');
    o.id = 'aviso'; o.className = 'ov';
    o.setAttribute('role', 'alertdialog'); o.setAttribute('aria-modal', 'true');
    o.innerHTML = `<div class="modal"><div class="av" style="margin:0 auto">${ic('clock', 24)}</div><h3>¿Sigues ahí?</h3><p>Por seguridad, cerraremos tu sesión en <b id="avseg"></b> por inactividad.</p><button class="btn" data-act="seguir">Seguir en la app</button><button class="btn sec" data-act="salir">Cerrar sesión</button></div>`;
    document.body.appendChild(o);
  }
  $('#avseg').textContent = seg + ' s';
}
['click', 'keydown', 'touchstart', 'scroll', 'input'].forEach(ev => document.addEventListener(ev, () => { if (!$('#aviso')) marcarAct(); }, { passive: true, capture: true }));
function revisarInact() {
  if (!S.user) { quitarAviso(); ultimaAct = Date.now(); return; }
  const idle = Date.now() - ultimaAct, limite = INACT_MIN * 60000, tope = limite + AVISO_SEG * 1000;
  if (idle >= tope) { quitarAviso(); S.loginError = 'Tu sesión se cerró por inactividad.'; signOut(auth); }
  else if (idle >= limite) mostrarAviso(Math.ceil((tope - idle) / 1000));
}
setInterval(revisarInact, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarInact(); });
window.addEventListener('pageshow', revisarInact);

async function fallo(msg) { S.loginError = msg; await signOut(auth); }

onAuthStateChanged(auth, async u => {
  if (!u) { try { localStorage.removeItem(KACT); } catch (_) {} quitarAviso(); const rc = $('#recarga'); if (rc) rc.remove(); limpiarCache(); S.datosAdm = null; S.rango = null; S.user = null; S.rol = null; S.stale = false; go('login'); return; }
  let prev = 0;
  try { prev = parseInt(localStorage.getItem(KACT) || '0', 10) || 0; } catch (_) {}
  if (prev && Date.now() - prev > INACT_MIN * 60000 + AVISO_SEG * 1000) { S.loginError = 'Tu sesión se cerró por inactividad.'; await signOut(auth); return; }
  S.user = u; ultimaAct = Date.now(); guardarAct(true);
  const esAdmin = (u.email || '').toLowerCase() === ADMIN_EMAIL;
  const vista = esAdmin ? 'a_resumen' : 'c_inicio';
  const c = leer(u.uid);
  let rapido = false;
  if (c && c.rol === (esAdmin ? 'admin' : 'cobrador')) {
    rapido = true; S.stale = true; S.rol = c.rol;
    if (esAdmin) { S.nombre = 'Administrador'; S.cobradores = c.cobradores; }
    else { S.cid = c.cid; S.nombre = c.nombre; S.caja = c.caja; S.prestamos = c.prestamos; }
    go(vista);
  } else {
    $('#app').innerHTML = '<div class="splash">Cargando…</div>';
  }
  try {
    if (esAdmin) {
      S.rol = 'admin'; S.nombre = 'Administrador';
      await cargarAdmin();
    } else {
      const us = await getDoc(doc(db, 'users', u.uid));
      if (!us.exists()) return fallo('Tu usuario todavía no está configurado. Avisa al administrador.');
      const d = us.data();
      if (d.activo === false) return fallo('Tu cuenta está desactivada. Habla con el administrador.');
      S.rol = 'cobrador'; S.cid = d.cobradorId; S.nombre = d.nombre;
      await cargarCobrador();
    }
    S.stale = false;
    if (!rapido || S.view === vista) go(vista);
    if (!esAdmin) revisarRecargas(true).catch(() => {});
  } catch (e) {
    console.error(e);
    if (rapido) toast('Sin conexión: te muestro los últimos datos guardados', 'err');
    else fallo('No se pudo cargar tu información. Revisa tu internet e intenta de nuevo.');
  }
});
